name: Build NextEcom Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: react-native-mercato/package-lock.json

      - name: Install Node Dependencies
        working-directory: react-native-mercato
        run: npm ci || npm install --legacy-peer-deps

      - name: Expo Prebuild Android
        working-directory: react-native-mercato
        run: npx expo prebuild --platform android --clean

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android Release APK
        working-directory: react-native-mercato/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -x lint

      - name: Find and Rename APK
        run: |
          mkdir -p build-output
          APK_FILE=$(find react-native-mercato/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: No APK file found!"
            exit 1
          fi
          echo "Found APK at: $APK_FILE"
          cp "$APK_FILE" build-output/NextEcom-v1.0.0.apk
          echo "Copied to build-output/NextEcom-v1.0.0.apk"
          ls -lh build-output/NextEcom-v1.0.0.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NextEcom-Android-APK
          path: build-output/NextEcom-v1.0.0.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: NextEcom Mobile App v1.0.0 (Build #${{ github.run_number }})
          body: |
            ## 📱 NextEcom WooCommerce Mobile Storefront APK
            
            This APK is built automatically from the latest codebase:
            - **Real-time Live Countdown Timer** in Flash Sale section
            - **WooCommerce Catalog Product Selector**
            - **Trust & Guarantee Badges** with dynamic icons, titles, and descriptions
            - **Saved Delivery Address** card and chooser at Checkout
            - **Auto-connect & Storefront Launcher**
            - **NextEcom Brand Identity**
            
            ### How to Install:
            1. Download `NextEcom-v1.0.0.apk` below directly to your Android device.
            2. Open the downloaded file to install (allow "Install from unknown sources" if prompted).
            3. Enjoy shopping on **NextEcom**!
          files: build-output/NextEcom-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
